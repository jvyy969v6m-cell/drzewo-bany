<title>Drzewo Bany</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Układ: nagłówek + jeden widok + dolna nawigacja; szczegóły osoby w arkuszu wysuwanym od dołu.
   Kolor linii rodu niesie informację (Bany / Sabat / Grabowscy i Janiccy / Bartnik / inne), reszta jest chłodna i spokojna. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface2:#E7EDE9; --fg:#15211C; --muted:#5A6A62; --line:#D3DCD6;
  --accent:#2C6B4D; --accent-fg:#FFFFFF; --warn:#8A5200; --warn-bg:#FAEFD6; --bad:#A3362B; --bad-bg:#F9E3E0; --ok:#2C6B4D;
  --l-bany:#2C6B4D; --l-sabat:#3A6A9C; --l-grab:#A5522D; --l-bartnik:#A07C12; --l-inne:#76827C;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --nav-h:58px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1613; --surface:#17211C; --surface2:#202D27; --fg:#E6EEE9; --muted:#93A59B; --line:#2B3A33;
  --accent:#6FC49A; --accent-fg:#0F1613; --warn:#E6B65E; --warn-bg:#33280F; --bad:#F29084; --bad-bg:#3A1C18; --ok:#6FC49A;
  --l-bany:#6FC49A; --l-sabat:#80AFDD; --l-grab:#E3916A; --l-bartnik:#D9B74F; --l-inne:#98A59E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#17211C; --surface2:#202D27; --fg:#E6EEE9; --muted:#93A59B; --line:#2B3A33;
  --accent:#6FC49A; --accent-fg:#0F1613; --warn:#E6B65E; --warn-bg:#33280F; --bad:#F29084; --bad-bg:#3A1C18; --ok:#6FC49A;
  --l-bany:#6FC49A; --l-sabat:#80AFDD; --l-grab:#E3916A; --l-bartnik:#D9B74F; --l-inne:#98A59E; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:.01em}
#app{max-width:980px;margin:0 auto;min-height:100%;padding-bottom:calc(var(--nav-h) + 28px)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 0 8px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.top h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em;flex:1;min-width:0}
.top h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;min-height:40px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.view{padding-top:12px}
.banner{border-radius:10px;padding:10px 12px;font-size:13.5px;margin:0 0 12px;background:var(--warn-bg);color:var(--warn)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.ok{background:var(--surface2);color:var(--muted)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--lc,var(--l-inne));flex:none}
.l-Bany{--lc:var(--l-bany)} .l-Sabat{--lc:var(--l-sabat)} .l-G{--lc:var(--l-grab)} .l-Bartnik{--lc:var(--l-bartnik)} .l-Inne{--lc:var(--l-inne)}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list>li{border-top:1px solid var(--line)} .list>li:first-child{border-top:0}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:11px 12px;min-height:52px}
.row .nm{font-weight:600} .row .sub{color:var(--muted);font-size:13px}
.row .main{flex:1;min-width:0} .row .main>*{overflow-wrap:anywhere}
.pill{font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 8px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.ok{background:var(--surface2);color:var(--ok)}
/* drzewo */
.tr{display:flex;align-items:stretch;border-top:1px solid var(--line);background:var(--surface)}
.tr:first-child{border-top:0}
.tr .gd{display:flex;flex:none;padding-left:8px}
.gd i{width:16px;position:relative;flex:none}
.gd i.v::before,.gd i.t::before,.gd i.l::before{content:"";position:absolute;left:7px;top:0;bottom:0;border-left:1.5px solid var(--line)}
.gd i.l::before{bottom:auto;height:24px;border-bottom:1.5px solid var(--line);border-bottom-left-radius:6px;width:9px}
.gd i.t::after{content:"";position:absolute;left:7px;top:24px;width:9px;border-top:1.5px solid var(--line)}
.tr .row{padding-left:12px}.tr .gd+.row{padding-left:4px}
.tr .tg{flex:none;width:34px;border:0;background:none;color:var(--muted);font-size:12px}
.tr .sp{color:var(--muted);font-size:13px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:2px 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* graf */
.gen{margin:18px 0 8px;display:flex;align-items:baseline;gap:10px}
.gen h2{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.gen span{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.pc{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px 10px;display:flex;flex-direction:column;gap:3px;min-width:0;border-top:3px solid var(--lc,var(--l-inne))}
.pc .nm{font-weight:600;overflow-wrap:anywhere} .pc .yr{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pc .rl{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
/* nawigacja */
nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:0 max(0px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-right,0px))}
nav .in{display:flex;width:100%;max-width:640px}
nav button{flex:1;border:0;background:none;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent)}
nav .bd{position:absolute;top:7px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
/* arkusz */
.shw{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.shw .bg{position:absolute;inset:0;background:rgba(5,12,9,.5)}
.sh{position:relative;background:var(--bg);width:100%;max-width:620px;max-height:calc(100% - env(safe-area-inset-top,0px) - 10px);display:flex;flex-direction:column;border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
@media(min-width:700px){.shw{align-items:center}.sh{border-radius:16px;max-height:88%}}
.sh header{display:flex;align-items:center;gap:8px;padding:12px max(16px,env(safe-area-inset-left,0px)) 10px;border-bottom:1px solid var(--line)}
.sh header h2{margin:0;font-size:17px;flex:1;min-width:0;overflow-wrap:anywhere}
.sh .bd{overflow:auto;padding:14px max(16px,env(safe-area-inset-left,0px));overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sh footer{display:flex;gap:8px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.sh footer .btn{flex:1 1 auto}
.kv{display:grid;grid-template-columns:minmax(96px,34%) 1fr;gap:6px 12px;margin:0 0 14px}
.kv dt{color:var(--muted);font-size:13px} .kv dd{margin:0;overflow-wrap:anywhere}
.sec{margin:16px 0 6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:14px;text-align:left}
/* formularze */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 10px}
.fg .full{grid-column:1/-1}
@media(max-width:420px){.fg{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 10px;font-size:16px;font-weight:400;color:var(--fg);width:100%;min-width:0}
label.f textarea{min-height:84px;resize:vertical}
label.f small{font-weight:400;font-size:12px}
.warnbox{border-radius:9px;padding:8px 10px;background:var(--warn-bg);color:var(--warn);font-size:13px;margin-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);background:var(--fg);color:var(--bg);border-radius:10px;padding:9px 14px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.menu .row .arrow{color:var(--muted)}
textarea.raw{width:100%;min-height:120px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px}
p{margin:0 0 10px} .muted{color:var(--muted)}
h3{font-size:15px;margin:18px 0 8px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
@media(prefers-reduced-motion:no-preference){.sh{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

function normalize(st){
  st.osoby ||= []; st.malzenstwa ||= []; st.zrodla ||= []; st.hipotezy ||= []; st.zadania ||= [];
  st.korzen ||= (st.osoby[0] && st.osoby[0].id) || '';
  st.meta ||= {backupAt:null, changes:0};
  return st;
}
function load(){
  try { const t = localStorage.getItem(KEY); if (t) S = normalize(JSON.parse(t)); } catch(e){ storageOK = false; }
  if (!S) S = normalize(clone(SEED));
  reindex(); syncMarriages();
}
function save(){
  S.meta.changes = (S.meta.changes || 0) + 1;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ storageOK = false; }
}
let byId = {}, idx = new Map();
function reindex(){ byId = {}; idx = new Map(); S.osoby.forEach((p,i) => { byId[p.id] = p; idx.set(p.id, i); }); }

/* ---------- wyliczenia (odpowiedniki kolumn „auto” z arkusza) ---------- */
const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
const idNum = p => { const n = parseInt(String(p.id).slice(1), 10); return isNaN(n) ? 999 : n; };
const nameOf = p => p ? `${p.imie || ''} ${p.nazwisko || ''}`.trim() : '';
const maiden = p => p.panienskie && p.panienskie !== '?' && p.panienskie !== p.nazwisko ? p.panienskie : '';
const labelOf = p => p ? nameOf(p) + (maiden(p) ? ` (z d. ${maiden(p)})` : '') : '';
const baseName = p => (p.panienskie && p.panienskie !== '?') ? p.panienskie : p.nazwisko;
function lineage(p){
  const b = baseName(p);
  if (b === 'Bany') return 'Bany'; if (b === 'Sabat') return 'Sabat';
  if (['Grabowski','Grabowska','Janicki','Janicka'].includes(b)) return 'Grabowscy i Janiccy';
  if (b === 'Bartnik') return 'Bartnik'; return 'Inne';
}
const lcls = p => ({'Bany':'l-Bany','Sabat':'l-Sabat','Grabowscy i Janiccy':'l-G','Bartnik':'l-Bartnik'}[lineage(p)] || 'l-Inne');
function years(p){
  const I = p.rokUr ?? '', M = p.rokZg ?? '';
  if (I === '' && M === '' && p.zyje !== 'Nie') return '';
  if (M === '' && p.zyje !== 'Nie') return 'ur. ' + I;
  return (I === '' ? '?' : I) + ' – ' + (M === '' ? '†' : M);
}
const age = p => (num(p.rokUr) != null && num(p.rokZg) != null) ? num(p.rokZg) - num(p.rokUr) : null;
const ord = (p, d) => num(p.kolejnosc) ?? d;
const cmpTree = (a,b) => (ord(a,500) - ord(b,500)) || (idNum(a) - idNum(b));
const cmpGraf = (a,b) => (ord(a,1000) - ord(b,1000)) || (idx.get(a.id) - idx.get(b.id));
const childrenOf = id => S.osoby.filter(p => p.ojciec === id || p.matka === id).sort(cmpTree);

function buildTree(rootId){
  const root = byId[rootId]; const inTree = new Set(); if (!root) return {nodes:null, inTree};
  function walk(p, depth){
    inTree.add(p.id);
    const node = {p, spouse: byId[p.malzonek] || null, kids: []};
    if (depth < 12) for (const c of childrenOf(p.id)) if (!inTree.has(c.id)) node.kids.push(walk(c, depth + 1));
    return node;
  }
  return {nodes: walk(root, 0), inTree};
}

/* ---------- małżeństwa (wyprowadzane z pól „małżonek” w Osoby) ---------- */
function orient(p, q){
  const a = p.plec, b = q.plec;
  const husband = a === 'M' ? (b === 'M' ? p.id < q.id : true) : a === 'K' ? (b === 'K' ? p.id < q.id : false) : b === 'K' ? true : b === 'M' ? false : p.id < q.id;
  return husband ? [p, q] : [q, p];
}
function pairs(){
  const seen = new Set(), out = [];
  for (const p of S.osoby){
    const q = byId[p.malzonek]; if (!q || q.id === p.id) continue;
    const key = [p.id, q.id].sort().join('|'); if (seen.has(key)) continue; seen.add(key);
    const [m, z] = orient(p, q); out.push({key, maz: m.id, zona: z.id});
  }
  return out;
}
const nextMid = () => 'M' + String(Math.max(0, ...S.malzenstwa.map(m => parseInt(String(m.id).slice(1), 10) || 0)) + 1).padStart(2, '0');
function syncMarriages(){
  let changed = false;
  for (const pr of pairs()){
    const e = S.malzenstwa.find(m => (m.maz === pr.maz && m.zona === pr.zona) || (m.maz === pr.zona && m.zona === pr.maz));
    if (!e){ S.malzenstwa.push({id: nextMid(), maz: pr.maz, zona: pr.zona, data:'', miejsce:'', parafia:'', akt:'', zrodlo:'', uwagi:''}); changed = true; }
    else if (e.maz !== pr.maz){ e.maz = pr.maz; e.zona = pr.zona; changed = true; }
  }
  return changed;
}
const kids = m => S.osoby.filter(p => (p.ojciec === m.maz && p.matka === m.zona) || (p.ojciec === m.maz && !p.matka) || (!p.ojciec && p.matka === m.zona)).length;
function mStatus(m){
  const a = byId[m.maz], b = byId[m.zona];
  if (!a || !b) return 'Nie ma takiej osoby w Osoby';
  return (a.malzonek === b.id && b.malzonek === a.id) ? 'OK' : 'Niezgodne ID małżonka w Osoby';
}

/* ---------- kontrola ---------- */
function checks(){
  const out = [], ids = {};
  const {inTree} = buildTree(S.korzen);
  for (const p of S.osoby){
    if (ids[p.id]) out.push({sev:'bad', id:p.id, t:`${p.id}: powtórzone ID`}); ids[p.id] = 1;
    if (p.pokolenie === '' || p.pokolenie == null) out.push({sev:'warn', id:p.id, t:`${nameOf(p)} (${p.id}): brak pokolenia, więc nie ma go w grafie w żadnym rzędzie`});
    for (const [k, lab, g] of [['ojciec','ojciec','M'],['matka','matka','K']]){
      const r = p[k]; if (!r) continue; const q = byId[r];
      if (!q) out.push({sev:'bad', id:p.id, t:`${nameOf(p)}: ${lab} ${r} nie istnieje`});
      else {
        if (q.plec && q.plec !== g) out.push({sev:'warn', id:p.id, t:`${nameOf(p)}: ${lab} ${nameOf(q)} ma płeć ${q.plec}`});
        if (num(q.pokolenie) != null && num(p.pokolenie) != null && num(q.pokolenie) !== num(p.pokolenie) - 1)
          out.push({sev:'warn', id:p.id, t:`${nameOf(p)} (pok. ${p.pokolenie}) i ${lab} ${nameOf(q)} (pok. ${q.pokolenie}): różnica nie wynosi 1`});
      }
    }
    if (p.malzonek){
      const q = byId[p.malzonek];
      if (!q) out.push({sev:'bad', id:p.id, t:`${nameOf(p)}: małżonek ${p.malzonek} nie istnieje`});
      else if (q.malzonek !== p.id) out.push({sev:'warn', id:p.id, t:`${nameOf(p)} wskazuje małżonka ${nameOf(q)}, ale ${nameOf(q)} wskazuje ${q.malzonek || 'nikogo'}`});
    }
    const sIds = new Set(S.zrodla.map(z => z.id));
    for (const s of String(p.zrodlo || '').match(/S\d+/g) || []) if (!sIds.has(s)) out.push({sev:'warn', id:p.id, t:`${nameOf(p)}: źródła ${s} nie ma w Źródłach`});
    if (lineage(p) === 'Bany' && baseName(p) === 'Bany' && !inTree.has(p.id) && !(byId[p.malzonek] && inTree.has(p.malzonek)))
      out.push({sev:'bad', id:p.id, t:`${nameOf(p)}: nazwisko Bany bez powiązania z linią główną (brak rodziców w Osoby)`});
  }
  for (const m of S.malzenstwa){ const s = mStatus(m); if (s !== 'OK') out.push({sev:'warn', mid:m.id, t:`Małżeństwo ${m.id}: ${s}`}); }
  return out;
}

/* ---------- widoki ---------- */
const ICON = {
  drzewo:'<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="19" r="2.2"/><path d="M12 7.2V12M12 12H6v4.8M12 12h6v4.8"/></svg>',
  graf:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="8" height="4" rx="1"/><rect x="13" y="10" width="8" height="4" rx="1"/><rect x="3" y="16" width="5" height="4" rx="1"/><rect x="10" y="16" width="5" height="4" rx="1"/><rect x="17" y="16" width="4" height="4" rx="1"/></svg>',
  osoby:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M16.5 5.2a3 3 0 0 1 0 5.6M18 14.8c1.8.7 3 2.3 3 4.7"/></svg>',
  malz:'<svg viewBox="0 0 24 24"><circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/></svg>',
  wiecej:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>'
};
const NAV = [['drzewo','Drzewo','drzewo'],['graf','Graf','graf'],['osoby','Osoby','osoby'],['malzenstwa','Małżeństwa','malz'],['wiecej','Więcej','wiecej']];
const MORE = ['zrodla','hipotezy','zadania','kontrola','kopia','pomoc'];
let view = 'drzewo';
const ui = {q:'', pok:'', linia:'', collapsed:new Set(), mq:''};

function route(){
  const h = location.hash.replace('#','');
  view = (NAV.some(n => n[0] === h) || MORE.includes(h)) ? h : 'drzewo';
  render();
}
function go(v){ if (location.hash === '#' + v) route(); else location.hash = v; }
window.addEventListener('hashchange', route);

function render(){
  const warns = checks().length;
  $('#nav').innerHTML = NAV.map(([k,l,i]) => {
    const cur = view === k || (k === 'wiecej' && MORE.includes(view));
    return `<button data-act="go" data-v="${k}" ${cur ? 'aria-current="page"' : ''}>${ICON[i]}<span>${l}</span>${k === 'wiecej' && warns ? `<span class="bd">${warns}</span>` : ''}</button>`;
  }).join('');
  const fn = {drzewo:vDrzewo, graf:vGraf, osoby:vOsoby, malzenstwa:vMalz, wiecej:vWiecej, zrodla:()=>vCrud('zrodla'), hipotezy:()=>vCrud('hipotezy'), zadania:()=>vCrud('zadania'), kontrola:vKontrola, kopia:vKopia, pomoc:vPomoc}[view];
  const keep = window.scrollY;
  $('#app').innerHTML = (storageOK ? '' : '<div class="banner bad" style="margin-top:12px">Ta przeglądarka nie zapisuje danych na urządzeniu. Zmiany znikną po zamknięciu karty. Rób kopię w Więcej → Kopia zapasowa.</div>') + fn();
  window.scrollTo(0, keep);
}
const hdr = (title, sub, right = '') => `<div class="top"><h1>${title}${sub ? `<small>${sub}</small>` : ''}</h1>${right}</div>`;
const pTag = p => `<span class="dot ${lcls(p)}"></span>`;

/* Drzewo */
function vDrzewo(){
  const {nodes, inTree} = buildTree(S.korzen);
  const opts = S.osoby.map(p => `<option value="${esc(p.id)}" ${p.id === S.korzen ? 'selected' : ''}>${esc(p.id)} · ${esc(nameOf(p))}</option>`).join('');
  let n = 0, body = '';
  function row(node, guides, last, depth){
    n++;
    const p = node.p, sp = node.spouse, has = node.kids.length, col = ui.collapsed.has(p.id);
    const gd = guides.map(g => `<i class="${g ? 'v' : ''}"></i>`).join('') + (depth ? `<i class="${last ? 'l' : 't'}"></i>` : '');
    body += `<div class="tr">${depth ? `<div class="gd">${gd}</div>` : ''}
      <button class="row" data-act="person" data-id="${esc(p.id)}">${pTag(p)}<span class="main"><span class="nm">${esc(labelOf(p))}</span> <span class="mono muted">${esc(years(p))}</span>
      ${sp ? `<div class="sp">∞ ${esc(labelOf(sp))} <span class="mono">${esc(years(sp))}</span></div>` : ''}</span><span class="pill">pok. ${esc(p.pokolenie || '?')}</span></button>
      ${has ? `<button class="tg" data-act="tg" data-id="${esc(p.id)}" aria-label="${col ? 'Rozwiń' : 'Zwiń'} potomków" aria-expanded="${!col}">${col ? '▸ ' + has : '▾'}</button>` : '<span class="tg"></span>'}</div>`;
    if (has && !col) node.kids.forEach((k, i) => row(k, depth ? [...guides, !last] : [], i === node.kids.length - 1, depth + 1));
  }
  if (nodes) row(nodes, [], true, 0);
  const total = inTree.size;
  const bany = checks().filter(c => c.t.includes('bez powiązania'));
  return hdr('Drzewo Bany', `${total} ${total === 1 ? 'osoba' : 'osób'} w linii potomków`, `<label class="f" style="min-width:0;flex:0 1 190px"><select id="root" aria-label="Osoba główna">${opts}</select></label>`) +
    `<div class="view">${bany.length ? `<div class="banner bad">${bany.length} os. z nazwiskiem Bany poza linią główną (brak rodziców w Osoby). Szczegóły w Więcej → Kontrola.</div>` : ''}
    ${legend()}<div class="list" style="border-radius:12px;overflow:hidden">${body || '<p class="muted" style="padding:14px">Wybierz osobę główną.</p>'}</div></div>`;
}
const legend = () => `<div class="legend">${[['Bany','l-Bany'],['Sabat','l-Sabat'],['Grabowscy i Janiccy','l-G'],['Bartnik','l-Bartnik'],['Inne','l-Inne']].map(([t,c]) => `<span class="${c}"><i class="dot"></i>${t}</span>`).join('')}</div>`;

/* Graf */
function vGraf(){
  const groups = new Map();
  for (const p of S.osoby){ const g = num(p.pokolenie) ?? 'brak'; (groups.get(g) || groups.set(g, []).get(g)).push(p); }
  const keys = [...groups.keys()].sort((a,b) => a === 'brak' ? 1 : b === 'brak' ? -1 : a - b);
  const roman = n => ['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'][n] || n;
  const html = keys.map(k => {
    const list = groups.get(k).sort(cmpGraf);
    return `<div class="gen"><h2>${k === 'brak' ? 'Bez pokolenia' : 'Pokolenie ' + roman(k)}</h2><span>osób: ${list.length}</span></div>
      <div class="cards">${list.map(p => `<button class="pc ${lcls(p)}" data-act="person" data-id="${esc(p.id)}"><span class="nm">${esc(labelOf(p))}</span><span class="yr">${esc(years(p)) || '&nbsp;'}</span>
        <span class="rl">${p.malzonek && byId[p.malzonek] ? '∞ ' + esc(nameOf(byId[p.malzonek])) : ''}</span>
        <span class="rl">${(byId[p.ojciec] || byId[p.matka]) ? '↑ ' + [byId[p.ojciec], byId[p.matka]].filter(Boolean).map(nameOf).map(esc).join(' + ') : ''}</span></button>`).join('')}</div>`;
  }).join('');
  return hdr('Graf rodziny', `${S.osoby.length} osób w ${keys.filter(k => k !== 'brak').length} pokoleniach`) + `<div class="view">${legend()}${html}</div>`;
}

/* Osoby */
function vOsoby(){
  const q = ui.q.trim().toLowerCase();
  let list = S.osoby.filter(p => (!ui.pok || String(p.pokolenie) === ui.pok) && (!ui.linia || lineage(p) === ui.linia) &&
    (!q || [p.id, nameOf(p), p.panienskie, p.miejsceUr, p.miejsceZg, p.zawod, p.zamieszkanie, p.uwagi].join(' ').toLowerCase().includes(q)));
  list = list.slice().sort((a,b) => idNum(a) - idNum(b));
  const gens = [...new Set(S.osoby.map(p => p.pokolenie).filter(g => g !== '' && g != null))].sort((a,b) => a - b);
  const lines = ['Bany','Sabat','Grabowscy i Janiccy','Bartnik','Inne'];
  return hdr('Osoby', `${list.length} z ${S.osoby.length}`, `<button class="btn pri" data-act="newp">+ Dodaj</button>`) +
    `<div class="view"><input class="search" id="q" type="search" placeholder="Szukaj: imię, nazwisko, ID, miejsce, uwagi" value="${esc(ui.q)}" aria-label="Szukaj osoby" autocomplete="off">
    <div class="chips" role="group" aria-label="Pokolenie">${gens.map(g => `<button class="chip" data-act="fpok" data-v="${g}" aria-pressed="${String(g) === ui.pok}">pok. ${g}</button>`).join('')}</div>
    <div class="chips" role="group" aria-label="Linia">${lines.map(l => `<button class="chip" data-act="flin" data-v="${esc(l)}" aria-pressed="${l === ui.linia}">${l}</button>`).join('')}</div>
    <ul class="list">${list.map(p => `<li><button class="row" data-act="person" data-id="${esc(p.id)}">${pTag(p)}
      <span class="main"><span class="nm">${esc(labelOf(p))}</span><div class="sub"><span class="mono">${esc(p.id)}</span>${years(p) ? ' · ' + esc(years(p)) : ''}${p.zawod ? ' · ' + esc(p.zawod) : ''}</div></span><span class="pill">pok. ${esc(p.pokolenie || '?')}</span></button></li>`).join('') || '<li style="padding:14px" class="muted">Nic nie pasuje do filtra.</li>'}</ul></div>`;
}

/* Małżeństwa */
function vMalz(){
  const q = ui.mq.trim().toLowerCase();
  const list = S.malzenstwa.filter(m => !q || [m.id, nameOf(byId[m.maz]), nameOf(byId[m.zona]), m.miejsce, m.parafia, m.akt, m.uwagi].join(' ').toLowerCase().includes(q));
  const missing = S.osoby.filter(p => p.malzonek && byId[p.malzonek] && !S.malzenstwa.some(m => [m.maz, m.zona].includes(p.id))).length;
  return hdr('Małżeństwa', `${S.malzenstwa.length} par, uzupełniają się z arkusza Osoby`) +
    `<div class="view"><input class="search" id="mq" type="search" placeholder="Szukaj pary, miejsca, aktu" value="${esc(ui.mq)}" aria-label="Szukaj małżeństwa" autocomplete="off" style="margin-bottom:12px">
    ${missing ? `<div class="banner">${missing} os. w związku bez wpisu na liście.</div>` : ''}
    <ul class="list">${list.map(m => { const st = mStatus(m), a = byId[m.maz], b = byId[m.zona];
      return `<li><button class="row" data-act="marr" data-id="${esc(m.id)}" style="align-items:flex-start"><span class="main"><span class="mono muted">${esc(m.id)}</span>
        <div class="nm">${esc(labelOf(a) || m.maz)} <span class="muted">∞</span> ${esc(labelOf(b) || m.zona)}</div>
        <div class="sub">${[m.data && 'ślub ' + m.data, m.miejsce, m.parafia, m.akt && 'akt ' + m.akt].filter(Boolean).map(esc).join(' · ') || 'brak danych o ślubie'}</div>
        ${m.uwagi ? `<div class="sub">${esc(m.uwagi)}</div>` : ''}</span>
        <span style="display:flex;flex-direction:column;gap:4px;align-items:flex-end"><span class="pill">dzieci: ${kids(m)}</span><span class="pill ${st === 'OK' ? 'ok' : 'warn'}">${st === 'OK' ? 'zgodne' : 'niezgodne'}</span></span></button></li>`; }).join('') || '<li style="padding:14px" class="muted">Brak par.</li>'}</ul></div>`;
}

/* Więcej */
function vWiecej(){
  const w = checks().length;
  const item = (v, t, sub, badge) => `<li><button class="row" data-act="go" data-v="${v}"><span class="main"><span class="nm">${t}</span><div class="sub">${sub}</div></span>${badge || ''}<span class="arrow muted">›</span></button></li>`;
  const open = S.zadania.filter(z => z.status !== 'Zrobione' && z.status !== 'Odrzucone').length;
  return hdr('Więcej') + `<div class="view"><ul class="list menu">
    ${item('zrodla','Źródła', 'Przejrzane dokumenty i ich wartość dla drzewa', `<span class="pill">${S.zrodla.length}</span>`)}
    ${item('hipotezy','Hipotezy', 'Osoby możliwe, ale niepotwierdzone', `<span class="pill">${S.hipotezy.length}</span>`)}
    ${item('zadania','Do zrobienia', 'Zadania według szans na wiarygodny wynik', `<span class="pill">${open} otwartych</span>`)}
    ${item('kontrola','Kontrola danych', 'Braki i niezgodności w powiązaniach', w ? `<span class="pill warn">${w}</span>` : '<span class="pill ok">czysto</span>')}
    ${item('kopia','Kopia zapasowa', 'Zapis, wczytywanie, eksport do Excela', S.meta.backupAt ? '' : '<span class="pill warn">brak kopii</span>')}
    ${item('pomoc','Zasady wpisywania', 'Jak wpisywać daty, ID, pewność i źródła')}
  </ul></div>`;
}

/* Kontrola */
function vKontrola(){
  const c = checks();
  return hdr('Kontrola danych', c.length ? `${c.length} uwag` : 'wszystko spójne', `<button class="btn sm" data-act="go" data-v="wiecej">Wróć</button>`) +
    `<div class="view">${c.length ? `<ul class="list">${c.map(x => `<li><button class="row" data-act="${x.mid ? 'marr' : 'person'}" data-id="${esc(x.mid || x.id)}"><span class="pill ${x.sev}">${x.sev === 'bad' ? 'błąd' : 'uwaga'}</span><span class="main">${esc(x.t)}</span><span class="muted">›</span></button></li>`).join('')}</ul>` :
    '<div class="banner ok">Brak braków. Każde ID rodzica, małżonka i źródła wskazuje istniejący wpis, a pokolenia zgadzają się z rodzicami.</div>'}</div>`;
}

/* Pomoc */
function vPomoc(){
  const R = [['ID osoby','P001, P002… Nowa osoba dostaje kolejny wolny numer automatycznie. Powiązania (ojciec, matka, małżonek) wybierasz z listy, nie wpisujesz nazwiskiem.'],

const nextPid = () => 'P' + String(Math.max(0, ...S.osoby.map(p => parseInt(String(p.id).slice(1), 10) || 0)) + 1).padStart(3, '0');
function field(k, l, spec, val, id = 'f_'){
  const full = spec === 'area' || (spec && spec.hint) ? ' full' : '';
  const sp = Array.isArray(spec) ? {o:spec} : (typeof spec === 'object' ? spec : {});
  let inner;
  if (spec === 'area') inner = `<textarea id="${id}${k}">${esc(val)}</textarea>`;
  else if (sp.o) inner = `<select id="${id}${k}">${sp.o.map(o => `<option ${o === val ? 'selected' : ''} value="${esc(o)}">${esc(o || '—')}</option>`).join('')}</select>`;
  else if (sp.rel) inner = `<select id="${id}${k}">${relOpts(sp.rel, val, id === 'f_' ? editing : null)}</select>`;
  else inner = `<input id="${id}${k}" value="${esc(val)}" ${sp.n ? 'inputmode="numeric"' : ''} ${sp.ph ? `placeholder="${esc(sp.ph)}"` : ''} ${sp.ro ? 'readonly' : ''} autocomplete="off">`;
  return `<label class="f${full}"><span>${esc(l)}</span>${inner}${sp.hint ? `<small>${esc(sp.hint)}</small>` : ''}</label>`;
}
let editing = null;
function relOpts(g, val, self){
  const list = S.osoby.filter(p => p.id !== self && (g === '*' || !p.plec || p.plec === g || p.id === val)).sort((a,b) => idNum(a) - idNum(b));
  return `<option value="">— brak —</option>` + list.map(p => `<option value="${esc(p.id)}" ${p.id === val ? 'selected' : ''}>${esc(p.id)} · ${esc(labelOf(p))} ${esc(years(p))}</option>`).join('');

function editPerson(id, pre = {}){
  const isNew = !id; editing = id;
  const p = isNew ? Object.assign({id: nextPid(), zyje:'Tak', pewnosc:'Podane (niezweryfikowane)', zrodlo:''}, pre) : byId[id];
  const body = `<div class="fg"><label class="f full"><span>ID osoby</span><input id="f_id" value="${esc(p.id)}" readonly></label>${PF.map(([k,l,s]) => field(k, l, s, p[k] ?? '')).join('')}</div><div id="pwarn"></div>`;

function readForm(){
  const o = {id: $('#f_id').value};
  for (const [k,,s] of PF){
    let v = $('#f_' + k).value.trim();
    if (s && s.n) v = v === '' ? '' : (isNaN(+v) ? '' : +v);
    o[k] = v;
  }
  const yr = s => { const m = /(\d{4})\s*$/.exec(s || ''); return m ? +m[1] : null; };
  if (yr(o.dataUr)) o.rokUr = yr(o.dataUr); if (yr(o.dataZg)) o.rokZg = yr(o.dataZg);

function savePerson(isNew){
  const o = readForm();
  if (!o.imie && !o.nazwisko){ $('#pwarn').innerHTML = '<div class="warnbox">Wpisz imię lub nazwisko.</div>'; return; }
  if (o.malzonek === o.id || o.ojciec === o.id || o.matka === o.id){ $('#pwarn').innerHTML = '<div class="warnbox">Osoba nie może być własnym rodzicem ani małżonkiem.</div>'; return; }
  if (isNew){ if (byId[o.id]) o.id = nextPid(); S.osoby.push(o); }
  else {
    const old = byId[o.id];
    if (old.malzonek && old.malzonek !== o.malzonek && byId[old.malzonek] && byId[old.malzonek].malzonek === o.id) byId[old.malzonek].malzonek = '';
    Object.assign(old, o);
  }
  reindex();
  if (o.malzonek && byId[o.malzonek]){
    const q = byId[o.malzonek];
    if (q.malzonek && q.malzonek !== o.id && byId[q.malzonek] && byId[q.malzonek].malzonek === q.id) byId[q.malzonek].malzonek = '';
    q.malzonek = o.id;
  }
  syncMarriages(); save(); closeSheet(); render(); toast(isNew ? 'Dodano osobę' : 'Zapisano'); showPerson(o.id);
}
function deletePerson(id){
  const p = byId[id];
  ask('Usunąć osobę?', `${nameOf(p)} (${id}) zniknie z drzewa, grafu i małżeństw. Powiązania innych osób z nią zostaną wyczyszczone.`, 'Usuń', () => {
    S.osoby = S.osoby.filter(o => o.id !== id);
    S.osoby.forEach(o => { for (const k of ['ojciec','matka','malzonek']) if (o[k] === id) o[k] = ''; });

    if (S.korzen === id) S.korzen = (S.osoby[0] || {}).id || '';

  });
}

function parseJsonText(t){
  const o = JSON.parse(t);
  if (!o || !Array.isArray(o.osoby)) throw new Error('To nie jest kopia aplikacji Drzewo Bany.');
  return normalize({osoby:o.osoby, malzenstwa:o.malzenstwa || [], zrodla:o.zrodla || [], hipotezy:o.hipotezy || [], zadania:o.zadania || [], korzen:o.korzen, meta:o.meta});
}
let xlsxP;
function loadXlsx(){
  if (window.XLSX) return Promise.resolve();
  return xlsxP ||= new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = res; s.onerror = () => { xlsxP = null; rej(new Error('Nie udało się wczytać modułu Excela (potrzebny internet).')); }; document.head.appendChild(s); });
}
const OSOBY_H = [['ID','id'],['Imię i nazwisko',null],['Imię / imiona','imie'],['Nazwisko (obecne)','nazwisko'],['Nazwisko panieńskie','panienskie'],['Płeć (M/K)','plec'],['Pokolenie','pokolenie'],['Data urodzenia','dataUr'],['Rok urodzenia','rokUr'],['Miejsce urodzenia','miejsceUr'],['Parafia / USC (ur.)','parafiaUr'],['Data śmierci','dataZg'],['Rok śmierci','rokZg'],['Miejsce śmierci','miejsceZg'],['Wiek w chwili śmierci',null],['ID ojca','ojciec'],['Ojciec',null],['ID matki','matka'],['Matka',null],['ID małżonka','malzonek'],['Małżonek',null],['Zawód / zajęcie','zawod'],['Miejsce zamieszkania','zamieszkanie'],['Żyje?','zyje'],['Poziom pewności','pewnosc'],['Źródło (ID z arkusza Źródła)','zrodlo'],['Uwagi','uwagi'],['Kolejność na grafie (opcjonalnie)','kolejnosc']];
const MALZ_H = [['ID','id'],['ID męża','maz'],['Mąż',null],['ID żony','zona'],['Żona',null],['Data ślubu','data'],['Miejsce ślubu','miejsce'],['Parafia / USC','parafia'],['Nr aktu','akt'],['Źródło','zrodlo'],['Liczba dzieci w arkuszu Osoby',null],['Uwagi','uwagi']];
const ZR_H = [['ID','id'],['Archiwum / baza','archiwum'],['Zespół','zespol'],['Sygnatura','sygnatura'],['Opis dokumentu','opis'],['Daty','daty'],['Osoby o nazwisku Bany w dokumencie','osoby'],['Wartość dla drzewa','wartosc'],['Uwagi / wniosek','uwagi'],['Link / skan','link']];
const HY_H = [['ID','id'],['Osoba','osoba'],['Hipotetyczna relacja','relacja'],['Podstawa','podstawa'],['Czego brakuje','brakuje'],['Gdzie sprawdzić','gdzie'],['Status','status']];
const TD_H = [['Prio','prio'],['Zadanie','zadanie'],['Instytucja / baza','instytucja'],['Cel (kogo dotyczy)','cel'],['Szansa','szansa'],['Status','status'],['Termin','termin'],['Uwagi','uwagi']];
async function exportXlsx(){
  await loadXlsx();
  const wb = XLSX.utils.book_new();
  const sheet = (name, H, rows, extra = {}) => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([H.map(h => h[0]), ...rows.map(r => H.map(([h,k]) => k ? (r[k] ?? '') : (extra[h] ? extra[h](r) : '')))]), name);
  sheet('Osoby', OSOBY_H, S.osoby, {'Imię i nazwisko':nameOf, 'Wiek w chwili śmierci':p => age(p) ?? '', 'Ojciec':p => nameOf(byId[p.ojciec]), 'Matka':p => nameOf(byId[p.matka]), 'Małżonek':p => nameOf(byId[p.malzonek])});
  sheet('Małżeństwa', MALZ_H, S.malzenstwa, {'Mąż':m => nameOf(byId[m.maz]), 'Żona':m => nameOf(byId[m.zona]), 'Liczba dzieci w arkuszu Osoby':kids});
  sheet('Źródła', ZR_H, S.zrodla); sheet('Hipotezy', HY_H, S.hipotezy); sheet('Do zrobienia', TD_H, S.zadania);
  XLSX.writeFile(wb, `drzewo_Bany_${stamp()}.xlsx`);
}
async function importXlsx(file){
  await loadXlsx();
  const wb = XLSX.read(await file.arrayBuffer(), {type:'array', cellDates:true});
  const fmt = v => { if (v instanceof Date){ const d = new Date(v.getTime() + 12 * 3600e3); return `${String(d.getUTCDate()).padStart(2,'0')}.${String(d.getUTCMonth() + 1).padStart(2,'0')}.${d.getUTCFullYear()}`; } return v == null ? '' : (typeof v === 'string' ? v.trim() : v); };
  const read = (name, H) => {
    const ws = wb.Sheets[name]; if (!ws) return [];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true}); const head = (rows[0] || []).map(h => String(h).trim());
    const col = {}; for (const [h,k] of H) if (k){ const i = head.indexOf(h); if (i >= 0) col[k] = i; }
    return rows.slice(1).map(r => Object.fromEntries(Object.entries(col).map(([k,i]) => [k, fmt(r[i])]))).filter(o => Object.values(o).some(v => v !== ''));
  };
  const osoby = read('Osoby', OSOBY_H).filter(p => p.id);
  if (!osoby.length) throw new Error('W pliku nie ma arkusza „Osoby” z kolumną ID.');
  for (const p of osoby){ for (const k of ['pokolenie','rokUr','rokZg','kolejnosc']) p[k] = num(p[k]) ?? ''; if (!p.plec) p.plec = ''; }
  return normalize({osoby, malzenstwa:read('Małżeństwa', MALZ_H).filter(m => m.id), zrodla:read('Źródła', ZR_H), hipotezy:read('Hipotezy', HY_H), zadania:read('Do zrobienia', TD_H).map(t => ({...t, prio:num(t.prio) ?? t.prio})), korzen:S.korzen});
}

  fpok: t => { ui.pok = ui.pok === t.dataset.v ? '' : t.dataset.v; render(); },

  editp: t => editPerson(t.dataset.id),
  savep: t => savePerson(!!t.dataset.new),

  addsp: t => { const p = byId[t.dataset.id]; editPerson(null, {malzonek: p.id, pokolenie: p.pokolenie, plec: p.plec === 'M' ? 'K' : p.plec === 'K' ? 'M' : ''}); },
  marr: t => showMarr(t.dataset.id),

  delm: t => { S.malzenstwa = S.malzenstwa.filter(x => x.id !== t.dataset.id); save(); closeSheet(); render(); toast('Usunięto wpis'); },
  newc: t => editCrud(t.dataset.k, null), editc: t => editCrud(t.dataset.k, +t.dataset.i),
  savec: t => saveCrud(t.dataset.k, t.dataset.i),
  delc: t => { const k = t.dataset.k, i = +t.dataset.i; ask('Usunąć wpis?', 'Tej operacji nie da się cofnąć.', 'Usuń', () => { S[k].splice(i, 1); save(); render(); toast('Usunięto'); }); },
  bkcopy: async () => { const ok = await copyText(exportJson()); if (ok){ markBackup(); render(); toast('Skopiowano kopię. Wklej ją w Notatkach lub mailu.'); } else toast('Nie udało się skopiować. Użyj pobierania pliku.'); },
  bkfile: () => { download(`drzewo_Bany_${stamp()}.json`, new Blob([exportJson()], {type:'application/json'})); markBackup(); render(); toast('Jeśli plik się nie pobrał, użyj „Kopiuj kopię”.'); },
  bkxlsx: async () => { try { await exportXlsx(); toast('Eksport gotowy'); } catch(e){ toast(e.message); } },
  bkpaste: () => { try { applyImport(parseJsonText($('#bkpaste').value), 'Wklejona kopia'); } catch(e){ toast('Nie rozpoznano kopii: ' + e.message); } },
  bkundo: () => { try { const t = localStorage.getItem(KEY_PREV); S = normalize(JSON.parse(t)); reindex(); syncMarriages(); save(); render(); toast('Przywrócono poprzedni stan'); } catch(e){ toast('Brak poprzedniego stanu'); } },
  reset: () => ask('Przywrócić dane z arkusza?', 'Wszystkie Twoje zmiany zostaną zastąpione danymi początkowymi.', 'Przywróć', () => { try { localStorage.setItem(KEY_PREV, JSON.stringify(S)); } catch(e){} S = normalize(clone(SEED)); reindex(); syncMarriages(); save(); render(); toast('Przywrócono dane z arkusza'); })
};
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t) return; if (t.dataset.act === 'close' && e.target.closest('.sh') && !t.matches('button')) return; const f = A[t.dataset.act]; if (f){ e.preventDefault(); f(t); } });
document.addEventListener('input', e => {
  if (e.target.id === 'q'){ ui.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }
  if (e.target.id === 'mq'){ ui.mq = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#mq'); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener('change', async e => {
  if (e.target.id === 'root'){ S.korzen = e.target.value; save(); render(); }
  if (e.target.id === 'bkin' && e.target.files[0]){
    const f = e.target.files[0];
    try {
      if (/\.xlsx$/i.test(f.name)) applyImport(await importXlsx(f), 'Arkusz ' + f.name);
      else applyImport(parseJsonText(await f.text()), 'Plik ' + f.name);
    } catch(err){ toast('Nie udało się wczytać: ' + err.message); }
    e.target.value = '';
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

load(); route();
